name: Verify application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t atlas:test .
      - name: Verify container readiness and restart
        run: |
          mkdir -p /tmp/atlas-secrets
          docker run --rm --user 0 -v /tmp/atlas-secrets:/out --entrypoint python atlas:test -m scripts.package_corpus --corpus data/fixtures/corpus.jsonl --index data/fixtures/index.npz --output /out/bundle.json --compress-text
          docker run -d --name atlas --memory=512m --cpus=0.5 -v /tmp/atlas-secrets/bundle.json:/etc/secrets/bundle.json:ro -e CORPUS_BUNDLE_PATH=/etc/secrets/bundle.json -p 8000:8000 atlas:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/healthz
          curl -fsS -X POST http://localhost:8000/api/chat -H 'Content-Type: application/json' -d '{"message":"Where are the waterfront villas?","language":"en"}' | tee /tmp/chat-stream.txt
          grep -q 'not_configured' /tmp/chat-stream.txt
          curl -fsS -X POST http://localhost:8000/api/chat -H 'Content-Type: application/json' -d '{"message":"ما هي خدمات وصلت؟","language":"ar"}' | tee /tmp/chat-ar-stream.txt
          grep -q 'not_configured' /tmp/chat-ar-stream.txt
          docker restart atlas
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/healthz
          docker stats --no-stream atlas
      - if: failure()
        run: docker logs atlas || true
